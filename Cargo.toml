[package]
name = "roblox-multi-account-launcher"
version = "3.1.0-beta.1"
edition = "2024"
authors = ["Wolfy"]
description = "External Windows Roblox launcher and multi-account process manager"
license = "MIT"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
semver = "1.0"
sha2 = "0.10"
tray-icon = "0.24.2"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
windows = { version = "0.61.3", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
