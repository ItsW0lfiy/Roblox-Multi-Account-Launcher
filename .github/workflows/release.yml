name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Rust stable
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      - name: Validate tag and source
        shell: pwsh
        run: |
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $version = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version." }
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build assets and manifest
        shell: pwsh
        run: .\build-release.ps1 -ReleaseUrl "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxMultiAccountLauncher-${{ github.ref_name }}
          path: |
            dist/RobloxMultiAccountLauncher.exe
            dist/update-manifest.json
      - name: Create GitHub prerelease
        if: contains(github.ref_name, '-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/RobloxMultiAccountLauncher.exe dist/update-manifest.json --verify-tag --generate-notes --prerelease
      - name: Create GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/RobloxMultiAccountLauncher.exe dist/update-manifest.json --verify-tag --generate-notes
